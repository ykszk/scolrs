[package]
name = "pyscol"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "pyscol"
crate-type = ["cdylib"]

[features]
gdcm = ["labelme-rs/gdcm"]

[dependencies]
env_logger.workspace = true
numpy = "0.21"
pyo3 = "0.21"
scolrs = { path = "../scolrs" }
devsc = { path = "../devsc" }
# [target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom = { features = ["js"] } # for ndarray-stats
# clahe = { path = "clahe" }
clahe = { git = "https://github.com/ykszk/clahe.git", branch="develop" }
serde.workspace = true
serde_json = "1.0.116"
svg = "0.18.0"
thiserror.workspace = true
log.workspace = true
labelme-rs = { git = "https://github.com/ykszk/labelme-rs.git" }

[dev-dependencies]
walkdir = "2.4.0"
