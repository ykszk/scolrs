[package]
name = "scolrs"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "scolrs"
path = "src/main.rs"

[lib]
name = "scolrs"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.4", features = ["derive"] }
csv = "1"
env_logger.workspace = true
labelme-rs = { version = "0.8.3", git = "https://github.com/ykszk/labelme-rs.git" }
log.workspace = true
lyon_geom = "1.0.4"
ndarray.workspace = true
ndarray-stats = "0"
rulinalg = "0.4.2"
serde = "1.0.188"
svg = "0.14"
thiserror = "1.0"
toml = "0.8.2"

[dev-dependencies]
pretty_assertions = "1.4.0"
