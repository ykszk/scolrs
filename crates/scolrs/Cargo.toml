[package]
name = "scolrs"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "scolrs"
path = "src/lib.rs"

[features]
dicom = ["labelme-rs/dicom"]
gdcm = ["dicom", "labelme-rs/gdcm"]
webp = ["dep:webp"]

[dependencies]
named_derive = { path = "../named_derive" }
csv = "1.3.0"
dicom-core = { version = "0.8.0" }
dicom-object = { version = "0.8.0" }
dicom-dictionary-std = { version = "0.8.0" }
lyon_geom = "1.0.4"
rulinalg = "0.4.2"                                    # replace with nalgebra?
serde_repr = "0.1.17"
strum = { version = "0.26.2", features = ["derive"] }
regex = "1.11.1"
base64 = "0.22.1"
webp = { version = "0.3.0", optional = true}
shadow-rs = { version = "1.1.1", default-features = false }

clap.workspace = true
env_logger.workspace = true
indexmap.workspace = true
labelme-rs.workspace = true
log.workspace = true
ndarray.workspace = true
ndarray-stats.workspace = true
serde.workspace = true
serde_json.workspace = true
svg.workspace = true
thiserror.workspace = true
scraper.workspace = true
tera.workspace = true

[dev-dependencies]
anyhow.workspace = true
pretty_assertions.workspace = true

[build-dependencies]
shadow-rs = "1.1.1"