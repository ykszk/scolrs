[package]
name = "scolrs"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "scolrs"
path = "src/main.rs"

[[bin]]
name = "neckrs"
path = "src/neck_main.rs"

[lib]
name = "scolrs"
path = "src/lib.rs"

[dependencies]
named_derive = { path = "../named_derive" }
anyhow.workspace = true
clap = { version = "4.4", features = ["derive"] }
csv = "1.3.0"
env_logger.workspace = true
indexmap = "2.2.6"
labelme-rs = { version = "0.10.0", git = "https://github.com/ykszk/labelme-rs.git" }
log.workspace = true
lyon_geom = "1.0.4"
ndarray.workspace = true
ndarray-stats = "0.6.0"
rulinalg = "0.4.2"                                                                   # replace with nalgebra?
serde.workspace = true
serde_repr = "0.1.17"
strum = { version = "0.26.2", features = ["derive"] }
svg = "0.18.0"
thiserror = "1.0"
toml = "0.8.2"
serde_json = "1.0.132"
glob = "0.3.1"
clap_complete = "4.5.35"
num-traits = "0.2.19"

[dev-dependencies]
pretty_assertions.workspace = true
