[package]
name = "deepscol"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true


[lib]
crate-type = ["cdylib", "rlib"]
name = "deepscol"
path = "src/lib.rs"

[[bin]]
name = "deepscol"
path = "src/main.rs"

[features]
# default = ["std"]
default = ["wasm"]
std = ["ort/std", "ort/download-binaries", "ort/half"]
wasm = ["ort/alternative-backend", "ort-tract", "wasm-bindgen", "wasm-logger", "getrandom", "console_error_panic_hook"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
dicom-object = "0.8.1"
dicom-pixeldata = { version = "0.8.1", default-features = false, features = ["native"] }
env_logger.workspace = true
getrandom = { version = "0.3.3", default-features = false, features = ["wasm_js"], optional = true }
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "tiff"] }
imageproc = "0.25.0"
labelme-rs.workspace = true
log.workspace = true
ndarray.workspace = true
ndarray-npz = { version = "0.4.2", default-features = false, features = ["compressed"] }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["ndarray"] }
ort-tract = { version = "0.1.0", optional = true }
scolrs = { path = "../scolrs", features = ['dicom'] }
serde_json.workspace = true
tracing-subscriber = "0.3.19"
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-logger = { version = "0.2.0", optional = true }

[build-dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
reqwest = { version = "0.12.22", features = ["blocking"] }
