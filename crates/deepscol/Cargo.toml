[package]
name = "deepscol"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true


[lib]
name = "deepscol"
path = "src/lib.rs"

[[bin]]
name = "deepscol"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
dicom-object = "0.8.1"
dicom-pixeldata = { version = "0.8.1", default-features = false, features = ["native", "openjp2", "charls", "image"] }
env_logger.workspace = true
image = "0.25.6"
imageproc = "0.25.0"
labelme-rs.workspace = true
log.workspace = true
ndarray.workspace = true
ndarray-npz = { version = "0.4.2", default-features = false, features = ["compressed"] }
ort = "1.16.3"
scolrs = { path = "../scolrs", features = ['dicom'] }
serde_json.workspace = true
tracing-subscriber = "0.3.19"

[build-dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
reqwest = { version = "0.12.22", features = ["blocking"] }
