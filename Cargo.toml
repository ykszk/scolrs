[workspace]
members = ["crates/scolrs", "crates/pyscol", "crates/devsc"]
default-members = ["crates/scolrs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yuki SUZUKI <y-suzuki@radiol.med.osaka-u.ac.jp>"]
repository = "https://github.com/ykszk/scolrs"
description = "Adolescent Idiopathic Scoliosis"

[workspace.dependencies]
anyhow = "1.0"
env_logger = "0.11.3"
log = "0.4.20"
ndarray = "0.15"
pretty_assertions = "1.4.0"
