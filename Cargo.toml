[workspace]
members = [
    "crates/scolrs",
    "crates/pyscol",
    "crates/devsc",
    "crates/named_derive",
]
default-members = ["crates/scolrs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yuki SUZUKI <y-suzuki@radiol.med.osaka-u.ac.jp>"]
repository = "https://github.com/ykszk/scolrs"
description = "Adolescent Idiopathic Scoliosis"

[workspace.dependencies]
anyhow = "1.0.92"
env_logger = "0.11.5"
log = "0.4.22"
ndarray = "0.16.1"
pretty_assertions = "1.4.1"
serde = "1.0.213"
